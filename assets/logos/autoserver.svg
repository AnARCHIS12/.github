<svg width="400" height="400" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="serverRackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="unitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="70%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#1c0a0c" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ef4444" flood-opacity="0.8" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="30" fill="#09090b" stroke="#27272a" stroke-width="2"/>
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="140" height="150" rx="10" fill="url(#serverRackGrad)" stroke="#3f3f46" stroke-width="2" />
    <rect x="4" y="8" width="6" height="134" rx="2" fill="#27272a" />
    <rect x="130" y="8" width="6" height="134" rx="2" fill="#27272a" />
    <circle cx="7" cy="20" r="1.5" fill="#71717a" />
    <circle cx="7" cy="75" r="1.5" fill="#71717a" />
    <circle cx="7" cy="130" r="1.5" fill="#71717a" />
    <circle cx="133" cy="20" r="1.5" fill="#71717a" />
    <circle cx="133" cy="75" r="1.5" fill="#71717a" />
    <circle cx="133" cy="130" r="1.5" fill="#71717a" />
    <!-- Unite 1 -->
    <rect x="14" y="15" width="112" height="32" rx="4" fill="url(#unitGrad)" stroke="#27272a" stroke-width="1" />
    <circle cx="27" cy="31" r="3.5" fill="#ef4444" filter="url(#redGlow)" />
    <circle cx="38" cy="31" r="3.5" fill="#22c55e" />
    <rect x="52" y="23" width="68" height="16" rx="2" fill="#09090b" stroke="#27272a" />
    <!-- Unite 2 -->
    <rect x="14" y="55" width="112" height="32" rx="4" fill="url(#unitGrad)" stroke="#27272a" stroke-width="1" />
    <circle cx="27" cy="71" r="3.5" fill="#ef4444" filter="url(#redGlow)" />
    <circle cx="38" cy="71" r="3.5" fill="#3b82f6" />
    <rect x="52" y="63" width="68" height="16" rx="2" fill="#09090b" stroke="#27272a" />
    <!-- Unite 3 -->
    <rect x="14" y="95" width="112" height="32" rx="4" fill="url(#unitGrad)" stroke="#27272a" stroke-width="1" />
    <circle cx="27" cy="111" r="3.5" fill="#ef4444" filter="url(#redGlow)" />
    <circle cx="38" cy="111" r="3.5" fill="#eab308" />
    <rect x="52" y="103" width="68" height="16" rx="2" fill="#09090b" stroke="#27272a" />
